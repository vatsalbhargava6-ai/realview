<!DOCTYPE html>
<html>

<head>

<title>Post Job - RealView</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<h2>🏪 Post a Job</h2>

<div>

<a href="/dashboard">
<button>Dashboard</button>
</a>

<a href="/explore">
<button>Explore</button>
</a>

</div>

</div>

<!-- FORM -->
<div class="form-container">

<form method="POST">

<h2>Fill Job Details</h2>

<input name="title" placeholder="Job Title (e.g. Cook, Helper)" required>

<input name="company" placeholder="Company / Shop Name" required>

<input name="city" placeholder="City (e.g. Bhopal)" required>

<input name="area" placeholder="Area / Location" required>

<!-- CATEGORY -->
<select name="category" required>

<option value="">Select Job Category</option>

<option value="Restaurant">Restaurant</option>
<option value="Shop">Shop</option>
<option value="Office">Office</option>
<option value="Delivery">Delivery</option>
<option value="Hotel">Hotel</option>
<option value="Other">Other</option>

</select>

<input name="salary" placeholder="Salary (e.g. 10,000/month)" required>

<input name="phone" placeholder="Phone Number / WhatsApp" required>

<button type="submit">Post Job 🚀</button>

</form>

</div>

</body>
</html>
